name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name HVAC_Territory_Discovery_v097 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HVAC-Territory-Discovery-v097-Windows
          path: dist/HVAC_Territory_Discovery_v097.exe
