name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read release identity from app
        shell: powershell
        run: python release_identity.py | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r requirements.txt

      - name: Run detector and territory regression tests
        run: python -m unittest -v test_detection_logic.py test_territories.py test_release_contract.py

      - name: Verify source model assets
        shell: powershell
        run: |
          $required = @(
            "models\candidate.pt",
            "models\pipeline_config.json",
            "models\resnet18_embedder_state_fp16.pt",
            "models\verifier_runtime.json"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing required model asset before build: $p" }
            $item = Get-Item $p
            Write-Host "$p : $($item.Length) bytes"
          }

      - name: Source model loading smoke test
        run: python -c "import app; app.LocalCV(); print('Source models loaded successfully')"

      - name: Build portable Windows app
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name %APP_NAME%
          --add-data "models;models"
          --collect-all ultralytics
          --collect-submodules torchvision
          app.py

      - name: Verify bundled model assets
        shell: powershell
        run: |
          $root = "dist\$env:APP_NAME"
          $names = @("candidate.pt","pipeline_config.json","resnet18_embedder_state_fp16.pt","verifier_runtime.json")
          $modelBase = $null
          foreach ($name in $names) {
            $matches = @(Get-ChildItem $root -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) { throw "Expected exactly one bundled model asset: $name; found $($matches.Count)" }
            $match = $matches[0]
            $sourceHash = (Get-FileHash -LiteralPath (Join-Path "models" $name) -Algorithm SHA256).Hash
            $bundledHash = (Get-FileHash -LiteralPath $match.FullName -Algorithm SHA256).Hash
            if ($sourceHash -ne $bundledHash) { throw "Bundled model asset differs from source: $name" }
            $base = Split-Path (Split-Path $match.FullName)
            if ($modelBase -and $modelBase -ne $base) { throw "Bundled model assets have inconsistent directories" }
            $modelBase = $base
            Write-Host "$name bundled at $($match.FullName) : $($match.Length) bytes"
          }
          "MODEL_BUNDLE_BASE=$modelBase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bundled model loading smoke test
        run: python -c "import os, sys, app; sys._MEIPASS=os.environ['MODEL_BUNDLE_BASE']; app.LocalCV(); print('Bundled model assets loaded successfully')"

      - name: Add documentation
        shell: powershell
        run: |
          $root = "dist\$env:APP_NAME"
          Copy-Item README.txt $root
          Copy-Item MODEL_CARD.txt $root
          Copy-Item "CHANGELOG_$($env:APP_TAG).txt" $root
          Copy-Item "REGRESSION_NOTES_$($env:APP_TAG).txt" $root
          Copy-Item FROZEN_DETECTION_CONTRACT.json $root

      - name: Zip portable app
        shell: powershell
        run: Compress-Archive -Path "dist\$env:APP_NAME\*" -DestinationPath "$($env:APP_NAME)_Windows.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: HVAC-Territory-Discovery-${{ env.APP_TAG }}-Windows
          path: ${{ env.APP_NAME }}_Windows.zip
          if-no-files-found: error
