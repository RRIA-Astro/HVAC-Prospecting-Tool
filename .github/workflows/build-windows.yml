name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Build portable Windows app
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name HVAC_Territory_Discovery_v0110
          --add-data "models;models"
          --collect-all ultralytics
          --collect-submodules torchvision
          app.py
      - name: Add documentation
        shell: powershell
        run: |
          Copy-Item README.txt dist\HVAC_Territory_Discovery_v0110\
          Copy-Item MODEL_CARD.txt dist\HVAC_Territory_Discovery_v0110\
      - name: Zip portable app
        shell: powershell
        run: Compress-Archive -Path dist\HVAC_Territory_Discovery_v0110\* -DestinationPath HVAC_Territory_Discovery_v0110_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HVAC-Territory-Discovery-v0110-Windows
          path: HVAC_Territory_Discovery_v0110_Windows.zip
